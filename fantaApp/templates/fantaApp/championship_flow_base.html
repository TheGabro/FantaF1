{% extends "fantaApp/base.html" %}

{% block content %}
<div class="mb-6 flex flex-wrap items-center justify-between gap-3 border-b border-line pb-4">
  <div class="flex items-center gap-3">
    <span class="h-8 w-1.5 rounded-full bg-accent"></span>
    <div>
      <p class="text-xs font-semibold uppercase tracking-wide text-muted">Campionato</p>
      <h1 class="text-lg font-bold leading-tight">
        {% block championship_banner_link %}
          <a href="{% url 'championship_dashboard' championship.id %}" class="hover:text-accent">
            {{ championship.name }} {{ championship.year }}
          </a>
        {% endblock %}
      </h1>
    </div>
  </div>
  <a href="{% url 'user_dashboard' %}" class="btn-ghost text-sm">← I miei campionati</a>
</div>

{% block championship_content %}{% endblock %}
{% endblock %}
